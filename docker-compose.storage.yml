services:
  server:
    environment:
      STORAGE_PROVIDER: "${STORAGE_PROVIDER:-s3}"
      S3_ENDPOINT: "${S3_ENDPOINT}"
      S3_REGION: "${S3_REGION:-eu-central-1}"
      S3_BUCKET: "${S3_BUCKET}"
      S3_ACCESS_KEY: "${S3_ACCESS_KEY}"
      S3_SECRET_KEY: "${S3_SECRET_KEY}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
      PROJECTS_ROOT: "${PROJECTS_ROOT:-/app/data/projects}"
      STORAGE_LOCAL_ROOT: "${STORAGE_LOCAL_ROOT:-/app/data/projects}"
