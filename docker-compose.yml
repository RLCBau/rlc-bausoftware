services:
  db:
    image: postgres@sha256:e4842c8a99ca99339e1693e6fe5fe62c7becb31991f066f989047dfb2fbf47af
    container_name: rlc-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: user
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: rlc
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user -d rlc"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true
    pids_limit: 512

  server:
    build:
      context: .
      dockerfile: apps/server/Dockerfile
    image: rlc-bausoftware-server
    container_name: rlc-server
    env_file:
      - ./apps/server/.env
    restart: unless-stopped
    user: "1000:1000"
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    pids_limit: 512
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:4000/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "127.0.0.1:4000:4000"
    environment:
      DATABASE_URL: "${DATABASE_URL}"
      DOTENV_CONFIG_PATH: /dev/null
    command: node -r ts-node/register/transpile-only src/index.ts
    volumes:
      - /opt/rlc-bausoftware/apps/server:/app:ro
      - /opt/rlc-bausoftware/apps/server/.env.runtime-empty:/app/.env:ro
      - /opt/rlc-bausoftware/apps/server/data:/app/data:rw

volumes:
  pgdata:
  miniodata:
