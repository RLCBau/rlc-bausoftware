services:
  ollama:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    container_name: rlc-ollama
    restart: unless-stopped
    environment:
      OLLAMA_HOST: 0.0.0.0:11434
      OLLAMA_KEEP_ALIVE: ${OLLAMA_KEEP_ALIVE:-10m}
      OLLAMA_MAX_LOADED_MODELS: "1"
      OLLAMA_NUM_PARALLEL: "1"
    expose:
      - "11434"
    volumes:
      - ollamadata:/root/.ollama
    mem_limit: ${OLLAMA_MEMORY_LIMIT:-3g}
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 8s
      retries: 30
      start_period: 20s

  ollama-init:
    image: ${OLLAMA_IMAGE:-ollama/ollama:latest}
    profiles: ["setup"]
    restart: "no"
    environment:
      OLLAMA_HOST: http://ollama:11434
    depends_on:
      ollama:
        condition: service_healthy
    command: ["pull", "${OLLAMA_MODEL:-qwen3.5:2b-q4_K_M}"]

  server:
    environment:
      RLC_AI_MODE: ${RLC_AI_MODE:-HYBRID}
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen3.5:2b-q4_K_M}
      OLLAMA_CONTEXT_TOKENS: ${OLLAMA_CONTEXT_TOKENS:-8192}
      OLLAMA_TIMEOUT_MS: ${OLLAMA_TIMEOUT_MS:-180000}
      RLC_PUBLIC_API_URL: ${RLC_PUBLIC_API_URL:?RLC_PUBLIC_API_URL fehlt}
      RLC_SERVER_NAME: ${RLC_SERVER_NAME:-RLC Private Server}
      RLC_COMPANY_CODE: ${RLC_COMPANY_CODE:-}
      RLC_SERVER_ID: ${RLC_SERVER_ID:?RLC_SERVER_ID fehlt}
      RLC_PAIRING_SECRET: ${RLC_PAIRING_SECRET:?RLC_PAIRING_SECRET fehlt}
      RLC_CONFIG_DIR: /app/data/config
    volumes:
      - rlcconfig:/app/data/config

volumes:
  ollamadata:
  rlcconfig:
